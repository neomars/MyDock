[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mydock-agent"
version = "1.1.1"
description = "MyDock : agent qui tourne sur le PC Ubuntu et expose son état et des actions à liste blanche au dock tactile"
requires-python = ">=3.11"
dependencies = [
    "mydock-common",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "websockets>=13",
    "psutil>=6,<8",
    "pydantic>=2.7,<3",
    "dbus-fast>=2,<6",
]

[project.scripts]
mydock-agent = "mydock_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["mydock_agent"]
