[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mydock-common"
version = "1.1.0"
description = "MyDock : protocole, jeton et configuration partagés entre l'agent (PC) et le serveur dock (Raspberry Pi)"
requires-python = ">=3.11"
dependencies = ["tomli-w>=1.0,<2", "pydantic>=2.7,<3"]

[tool.hatch.build.targets.wheel]
packages = ["mydock_common"]
