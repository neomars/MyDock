[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mydock-dock"
version = "1.5.2"
description = "MyDock : serveur local du dock (Raspberry Pi) - sert l'interface, relaie l'agent, Wake-on-LAN, configuration"
requires-python = ">=3.11"
dependencies = [
    "mydock-common",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "websockets>=13",
    "psutil>=6,<8",
    "pydantic>=2.7,<3",
]

[project.scripts]
mydock-dock = "mydock_dock.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["mydock_dock"]
